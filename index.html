    <style>
        body {

<body>
    <div id="canvas-container"></div>
    <div class="content">
        <div class="logo-wrap" id="logoWrap">
            <img src="assets/images/excel_logo_transparent.png" alt="Excel Logo" onerror="this.style.display='none'">
        </div>
        <h1 id="title">Excel ID Cards</h1>
        <p id="subtitle">Initializing Portal</p>
        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <script>
        // --- 1. Three.js 3D Setup ---
        const scene = new THREE.Scene();
        // Add subtle fog to blend particles smoothly into the background
        scene.fog = new THREE.FogExp2(0x050914, 0.15);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // optimize performance
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Create Particles (Starfield / Data Nodes effect)
        const geometry = new THREE.BufferGeometry();
        const particlesCount = 2500;
        const posArray = new Float32Array(particlesCount * 3);
        const colorsArray = new Float32Array(particlesCount * 3);
        const scalesArray = new Float32Array(particlesCount);

        const color1 = new THREE.Color(0x38bdf8); // Sky blue
        const color2 = new THREE.Color(0x818cf8); // Indigo
        const color3 = new THREE.Color(0xffffff); // White

        for(let i = 0; i < particlesCount; i++) {
            const i3 = i * 3;
            // Spread particles in a wide area
            posArray[i3] = (Math.random() - 0.5) * 15;
            posArray[i3+1] = (Math.random() - 0.5) * 15;
            posArray[i3+2] = (Math.random() - 0.5) * 15;

            // Mix colors randomly
            let mixedColor = color1.clone().lerp(color2, Math.random());
            if(Math.random() > 0.9) mixedColor = color3; // 10% white for sparkle

            colorsArray[i3] = mixedColor.r;
            colorsArray[i3+1] = mixedColor.g;
            colorsArray[i3+2] = mixedColor.b;

            // Randomize individual sizes
            scalesArray[i] = Math.random();
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colorsArray, 3));
        geometry.setAttribute('aScale', new THREE.BufferAttribute(scalesArray, 1));

        // Create a custom shader material to make points circular and fade nicely
        const material = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 }
            },
            vertexShader: `
                uniform float uTime;
                attribute float aScale;
                varying vec3 vColor;
                void main() {
                    vColor = color;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    // Pulsating size effect based on time and individual scale
                    float currentScale = aScale * (1.0 + 0.3 * sin(uTime + aScale * 10.0));
                    gl_PointSize = 15.0 * currentScale * (1.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                varying vec3 vColor;
                void main() {
                    // Create circular particles instead of squares
                    float distanceToCenter = distance(gl_PointCoord, vec2(0.5));
                    float alpha = 0.05 / distanceToCenter - 0.1;
                    gl_FragColor = vec4(vColor, alpha);
                }
            `,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            vertexColors: true
        });

        const particlesMesh = new THREE.Points(geometry, material);
        scene.add(particlesMesh);

        camera.position.z = 4;

        // --- 2. Animation Loop ---
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;

        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - windowHalfX);
            mouseY = (event.clientY - windowHalfY);
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Update shader uniform
            material.uniforms.uTime.value = elapsedTime;

            targetX = mouseX * 0.0005;
            targetY = mouseY * 0.0005;

            // Base rotation (slowly spinning)
            particlesMesh.rotation.y += 0.001;
            particlesMesh.rotation.x += 0.0005;
            
            // Subtle bobbing effect
            particlesMesh.position.y = Math.sin(elapsedTime * 0.3) * 0.1;

            // Interactive Parallax from mouse
            particlesMesh.rotation.y += 0.05 * (targetX - particlesMesh.rotation.y);
            particlesMesh.rotation.x += 0.05 * (targetY - particlesMesh.rotation.x);

            // Fly-through effect on camera
            camera.position.z -= 0.001;

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 3. GSAP UI Animations and Auto-Redirect ---
        window.onload = () => {
            const tl = gsap.timeline();
            
            // Stagger in the UI elements
            tl.to("#logoWrap", { opacity: 1, y: 0, duration: 1, ease: "power3.out" })
              .to("#title", { opacity: 1, y: 0, duration: 1, ease: "power3.out" }, "-=0.8")
              .to("#subtitle", { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, "-=0.6")
              .to("#progressBar", { opacity: 1, duration: 0.5 }, "-=0.4")
              // Fill the progress bar
              .to("#progressFill", { width: "100%", duration: 2.5, ease: "power1.inOut" });

            // Fly camera into the particles at the end
            gsap.to(camera.position, {
                z: 0.5,
                duration: 2.5,
                delay: 1.5,
                ease: "power2.in"
            });

            // Redirect after animations complete
            setTimeout(() => {
                // Final fade to black/dark blue
                gsap.to("body", { opacity: 0, duration: 0.6, onComplete: () => {
                    window.location.href = "frontend/index.html";
                }});
            }, 3500); // 3.5 seconds until redirect starts
        };
    </script>
