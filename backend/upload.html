<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Portal | Student Registration | Excel ID</title>
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/images/favicon.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../assets/css/style-app.css" />
  <style>
    .upload-container { max-width: 820px; margin: 0 auto; }
    .section-label { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--primary); margin-bottom: 1.25rem; }
    .progress-bar-wrap { height: 8px; background: var(--dark3); border-radius: 100px; margin: 0.75rem 0; overflow: hidden; display: none; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); width: 0%; transition: width 0.25s; }
    .td-photo { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; border: 1px solid var(--border); flex-shrink:0; }
    .record-item { display: flex; align-items: center; gap: 1rem; padding: 0.75rem 1rem; border-radius: var(--radius-sm); border: 1px solid var(--border); margin-bottom: 0.5rem; background: rgba(15,23,42,0.5); transition: border-color 0.2s; }
    .record-item:hover { border-color: var(--primary); }
    .record-info { flex: 1; min-width: 0; }
    .record-info strong { display: block; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .record-info span { font-size: 0.8rem; color: var(--text-muted); }
    .search-wrap { position: relative; margin-bottom: 1rem; }
    .search-wrap i { position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
    .search-wrap input { padding-left: 2.3rem; width: 100%; }
    .pagination-wrap { display: flex; justify-content: center; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap; }
    .page-btn { padding: 0.35rem 0.75rem; border-radius: var(--radius-sm); border: 1.5px solid var(--border); background: transparent; color: var(--text); cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
    .page-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .page-btn:hover:not(.active) { border-color: var(--primary); color: var(--primary); }
    .field-hint { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.3rem; }
    .input-valid { border-color: #22c55e !important; }
    .input-invalid { border-color: #ef4444 !important; }
    .status-msg { display: flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1rem; border-radius: var(--radius-sm); margin-bottom: 0.75rem; font-size: 0.9rem; font-weight: 600; display: none; }
    .status-msg.loading { background: rgba(99,102,241,0.12); color: #818cf8; border:1px solid rgba(99,102,241,0.3); }
    .status-msg.success { background: rgba(34,197,94,0.12); color: #22c55e; border:1px solid rgba(34,197,94,0.3); }
    .status-msg.error { background: rgba(239,68,68,0.12); color: #f87171; border:1px solid rgba(239,68,68,0.3); }
    @media (max-width: 600px) {
      .upload-container { padding: 0; }
      .record-item { flex-wrap: nowrap; }
    }
  </style>
</head>
<body>
  <div class="bg-mesh"></div>
  
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <img src="../assets/images/excel_logo_transparent.png" alt="Excel Logo">
          <span>School <b>Portal</b></span>
        </div>
      </div>
      <ul class="sidebar-menu">
        <li><a href="upload.html" class="active"><i class="fas fa-user-plus"></i> Add Student</a></li>
        <li><a href="id-preview.html"><i class="fas fa-id-card"></i> ID Preview</a></li>
        <li><a href="../frontend/index.html" target="_blank"><i class="fas fa-globe"></i> View Website</a></li>
        <li class="mobile-only"><a href="#" onclick="handleLogout(event)"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
      </ul>
      <div class="sidebar-footer">
        <button class="btn btn-outline btn-full" onclick="handleLogout(event)"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <div class="topbar-title">Student Registration</div>
        <div class="user-badge"><i class="fas fa-school"></i> <span class="user-name-display">Loading...</span></div>
      </div>

      <div class="content-area">
        <h1 class="page-title">Register <span>New Student</span></h1>

        <div class="upload-container">
          <div class="card">

            <!-- Status messages -->
            <div id="status-loading" class="status-msg loading"><i class="fas fa-spinner fa-spin"></i> Saving student record...</div>
            <div id="status-success" class="status-msg success"><i class="fas fa-check-circle"></i> <span id="success-text">Student saved successfully!</span></div>
            <div id="status-error" class="status-msg error"><i class="fas fa-exclamation-circle"></i> <span id="error-text">Something went wrong.</span></div>

            <div id="dynamic-form-wrap">
              <div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Loading fields...</p></div>
            </div>

            <div class="section-label" style="border-bottom:1px solid var(--border); padding-bottom:0.5rem; margin-bottom:1.5rem; margin-top:2.5rem;">
              <i class="fas fa-camera-retro"></i> Passport Photo <span style="color:#ef4444">*</span>
            </div>

            <div class="form-group">
              <label class="photo-upload-zone" for="s-photo" id="drop-zone" style="display: block; cursor: pointer;">
                <input type="file" id="s-photo" accept="image/*" style="display:none" />
                <i class="fas fa-camera"></i>
                <p>Click to select student photo</p>
                <span style="font-size:0.75rem; color:var(--text-muted)">Max 5MB · JPG, PNG, WEBP</span>
              </label>
              
              <div id="preview-container" style="display:none; text-align:center; margin-top:1.5rem; padding:1.5rem; border:1px dashed #22c55e; border-radius:8px; background:rgba(34,197,94,0.05)">
                <p style="font-size:0.85rem; font-weight:700; color:#22c55e; margin-bottom:0.8rem;"><i class="fas fa-check-circle"></i> Photo Ready</p>
                <img id="photo-preview" style="max-width:130px; border-radius:8px; display:none; margin:0 auto;" alt="Preview"/>
              </div>
            </div>

            <div class="progress-bar-wrap" id="progress-wrap">
              <div class="progress-bar-fill" id="progress-fill"></div>
            </div>

            <button id="upload-btn" class="btn btn-primary btn-full" onclick="submitData()" style="margin-top:1.5rem;">
              <span id="btn-text"><i class="fas fa-save"></i> Save Student Record</span>
              <div class="spinner" id="spinner"></div>
            </button>
          </div>

          <!-- Recent records with search + pagination -->
          <div class="card" style="padding: 1.5rem; margin-top: 2rem;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; flex-wrap:wrap; gap:0.5rem;">
              <div class="section-label" style="margin:0"><i class="fas fa-history"></i> Recent Students (<span id="total-count">0</span>)</div>
              <button class="btn btn-outline btn-sm" onclick="loadRecent()"><i class="fas fa-sync-alt"></i></button>
            </div>
            <div class="search-wrap">
              <i class="fas fa-search"></i>
              <input type="text" id="search-query" class="form-control" placeholder="Search by name or admission no..." oninput="searchStudents()">
            </div>
            <div id="recent-list">
              <div class="empty-state"><p>No records yet.</p></div>
            </div>
            <div class="pagination-wrap" id="pagination"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="../assets/js/auth.js"></script>
  <script type="module">
    import { guardPage, supabase } from "../assets/js/auth.js";
    import { handlePreview, resetForm, uploadToCloudinary } from "../assets/js/upload.js";

    let currentUser = null;
    let schoolFields = [];
    let allRecords = [];
    let currentPage = 1;
    const PAGE_SIZE = 20;
    let photoFile = null;

    guardPage('school').then(u => {
      currentUser = u;
      document.querySelector(".user-name-display").textContent = u.email?.split('@')[0] || u.email;
      loadTemplate();
      loadRecent();
    });

    // ── XSS SECURITY HELPER ──────────────────────────────────
    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      const div = document.createElement('div');
      div.textContent = String(str);
      return div.innerHTML;
    }

    // ── DRAG & DROP PHOTO UPLOAD UX ──────────────────────────
    const dropZone = document.getElementById('drop-zone');
    if (dropZone) {
      dropZone.addEventListener('dragover', e => {
        e.preventDefault();
        dropZone.classList.add('dragover');
      });

      dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('dragover');
      });

      dropZone.addEventListener('drop', e => {
        e.preventDefault();
        dropZone.classList.remove('dragover');

        const file = e.dataTransfer.files[0];
        if (!file) return;

        const photoInput = document.getElementById('s-photo');
        if (photoInput) {
          photoInput.files = e.dataTransfer.files;
          photoInput.dispatchEvent(new Event('change', { bubbles: true }));
        }
      });
    }

    // ── CONFIRM BEFORE LEAVING UNSAVED FORM ──────────────────
    window.addEventListener('beforeunload', function(e) {
      const hasData = [...document.querySelectorAll('.dynamic-input')].some(i => i.value.trim()) || photoFile;
      if (hasData) {
        e.preventDefault();
        e.returnValue = '';
      }
    });

    // ── HELPERS ──────────────────────────────────────────────
    function showStatus(type, msg) {
      ['loading','success','error'].forEach(t => {
        const el = document.getElementById(`status-${t}`);
        el.style.display = t === type ? 'flex' : 'none';
      });
      if (type === 'success') document.getElementById('success-text').textContent = msg;
      if (type === 'error')   document.getElementById('error-text').textContent = msg;
      if (type !== 'loading') setTimeout(() => clearStatus(), 5000);
    }
    function clearStatus() {
      ['loading','success','error'].forEach(t => {
        document.getElementById(`status-${t}`).style.display = 'none';
      });
    }

    // ── LOAD TEMPLATE ────────────────────────────────────────
    async function loadTemplate() {
      try {
        const { data: fields, error } = await supabase
          .from("student_fields")
          .select("*")
          .or(`school_id.is.null,school_id.eq.${currentUser.id}`)
          .eq("active", true)
          .order("display_order", { ascending: true })
          .order("created_at");
          
        if (error) throw error;
        schoolFields = fields || [];

        const wrap = document.getElementById("dynamic-form-wrap");
        if (schoolFields.length === 0) {
          wrap.innerHTML = '<div class="empty-state"><p>No fields found. Admin needs to add fields.</p></div>';
          return;
        }

        wrap.innerHTML = `<div class="section-label" style="border-bottom:1px solid var(--border); padding-bottom:0.5rem; margin-bottom:1.5rem">
          <i class="fas fa-list-alt"></i> Student Information
        </div>`;
        
        schoolFields.forEach(f => {
          const div = document.createElement("div");
          div.className = "form-group";

          // Label
          const label = document.createElement("label");
          label.style = "display:block; margin-bottom:0.5rem; font-weight:600";
          label.innerHTML = `${f.field_name} ${f.required ? '<span style="color:#ef4444">*</span>' : '<span style="font-size:0.75rem;color:var(--text-muted)">(optional)</span>'}`;
          div.appendChild(label);

          // Input
          const input = document.createElement("input");
          input.type = f.field_type || "text";
          input.name = f.field_key;
          input.id  = `field_${f.field_key}`;
          input.className = "form-control dynamic-input";
          input.placeholder = getPlaceholder(f);
          if (f.required) input.required = true;

          // Live validation on blur
          input.addEventListener('blur', () => validateField(f, input));
          input.addEventListener('input', () => { input.classList.remove('input-invalid','input-valid'); });
          div.appendChild(input);

          // Hint text
          const hint = document.createElement("p");
          hint.className = "field-hint";
          hint.id = `hint_${f.field_key}`;
          hint.textContent = getHint(f);
          div.appendChild(hint);

          wrap.appendChild(div);
        });

      } catch (err) {
        document.getElementById("dynamic-form-wrap").innerHTML =
          '<div class="empty-state"><p>Failed to load fields. Please refresh.</p></div>';
      }
    }

    function getPlaceholder(f) {
      const key = f.field_key;
      if (key === 'phone') return 'e.g. 9876543210';
      if (key === 'admission_no') return 'e.g. 2024001';
      if (key === 'name') return 'Full student name';
      return `Enter ${f.field_name}`;
    }
    function getHint(f) {
      const key = f.field_key;
      if (key === 'phone') return '10-digit mobile number';
      if (key === 'name')  return 'Minimum 2 characters';
      if (key === 'admission_no') return 'Must be unique within your school';
      return '';
    }

    // ── FIELD VALIDATION ────────────────────────────────────
    function validateField(f, input) {
      const val = input.value.trim();
      const hint = document.getElementById(`hint_${f.field_key}`);

      // Required check
      if (f.required && !val) {
        setInvalid(input, hint, `${f.field_name} is required`);
        return false;
      }

      // Phone: exactly 10 digits
      if (f.field_key === 'phone' && val) {
        if (!/^\d{10}$/.test(val)) {
          setInvalid(input, hint, 'Phone number must be exactly 10 digits');
          return false;
        }
      }

      // Name: minimum 2 chars
      if (f.field_key === 'name' && val && val.length < 2) {
        setInvalid(input, hint, 'Name must be at least 2 characters');
        return false;
      }

      if (val) setValid(input, hint, getHint(f));
      return true;
    }

    function setInvalid(input, hint, msg) {
      input.classList.add('input-invalid');
      input.classList.remove('input-valid');
      if (hint) { hint.textContent = '⚠ ' + msg; hint.style.color = '#ef4444'; }
    }
    function setValid(input, hint, msg) {
      input.classList.add('input-valid');
      input.classList.remove('input-invalid');
      if (hint) { hint.textContent = msg || '✔'; hint.style.color = '#22c55e'; }
    }

    // ── PHOTO ────────────────────────────────────────────────
    document.getElementById("s-photo").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) {
        showStatus('error', 'Photo must be less than 5MB');
        return;
      }
      photoFile = file;
      const reader = new FileReader();
      reader.onload = ev => {
        const img = document.getElementById("photo-preview");
        img.src = ev.target.result;
        img.style.display = 'block';
        document.getElementById("preview-container").style.display = 'block';
      };
      reader.readAsDataURL(file);
    });

    // ── SUBMIT ───────────────────────────────────────────────
    window.submitData = async function() {
      if (!currentUser || schoolFields.length === 0) return;
      clearStatus();

      const formData = {};
      let valid = true;

      // Validate all fields
      for (const f of schoolFields) {
        const input = document.getElementById(`field_${f.field_key}`);
        const ok = validateField(f, input);
        if (!ok) valid = false;
        formData[f.field_key] = input ? input.value.trim() : "";
      }

      if (!valid) {
        showStatus('error', 'Please fix the highlighted fields before saving.');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      if (!photoFile) {
        showStatus('error', 'Please upload a student passport photo.');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      // ── Duplicate admission_no check ─────────────────────
      const admNo = formData['admission_no'] || "";
      if (admNo) {
        const { data: existing } = await supabase
          .from('students')
          .select('id')
          .eq('school_id', currentUser.id)
          .eq('admission_no', admNo)
          .limit(1);

        if (existing && existing.length > 0) {
          showStatus('error', `Admission No "${admNo}" already exists for your school. Please check.`);
          const input = document.getElementById('field_admission_no');
          if (input) {
            const hint = document.getElementById('hint_admission_no');
            setInvalid(input, hint, 'This admission number already exists');
          }
          return;
        }
      }

      // ── Uploading ────────────────────────────────────────
      document.getElementById("upload-btn").disabled = true;
      document.getElementById("spinner").classList.add("show");
      document.getElementById("btn-text").style.display = "none";
      const pw = document.getElementById("progress-wrap");
      const pf = document.getElementById("progress-fill");
      pw.style.display = "block";
      showStatus('loading');
      window.scrollTo({ top: 0, behavior: 'smooth' });

      try {
        const photoURL = await uploadToCloudinary(photoFile, (percent) => {
          pf.style.width = percent + "%";
        });

        const insertPayload = {
          school_id:    currentUser.id,
          name:         formData["name"] || "Unknown",
          class:        formData["class"] || "",
          admission_no: formData["admission_no"] || "",
          photo_url:    photoURL,
          student_data: formData // Save entire custom form fields payload into JSONB column!
        };

        // Explicitly map designated table columns if they exist in the submitted form
        if (formData["parent_phone"]) {
          insertPayload.parent_phone = formData["parent_phone"];
        } else if (formData["phone"]) {
          insertPayload.parent_phone = formData["phone"];
        }

        if (formData["dob"]) {
          insertPayload.dob = formData["dob"];
        } else if (formData["date_of_birth"]) {
          insertPayload.dob = formData["date_of_birth"];
        }

        const { data: student, error: dbErr } = await supabase
          .from('students')
          .insert(insertPayload)
          .select()
          .single();
          
        if (dbErr) throw dbErr;

        // Save all dynamic field values
        const fieldRows = schoolFields.map(f => ({
          student_id: student.id,
          field_id:   f.id,
          value:      formData[f.field_key] || ""
        })).filter(r => r.value);
        
        if (fieldRows.length > 0) {
          const { error: fvErr } = await supabase.from("student_field_values").insert(fieldRows);
          if (fvErr) console.warn("Field values save warning:", fvErr.message);
        }

        showStatus('success', `✔ ${formData["name"] || "Student"} registered successfully!`);
        resetForm();
        photoFile = null;
        pf.style.width = "0%";
        document.getElementById("photo-preview").style.display = 'none';
        document.getElementById("preview-container").style.display = 'none';
        document.querySelectorAll('.dynamic-input').forEach(i => {
          i.value = "";
          i.classList.remove('input-valid', 'input-invalid');
        });
        loadRecent();

      } catch (err) {
        showStatus('error', 'Save failed: ' + err.message);
      } finally {
        document.getElementById("upload-btn").disabled = false;
        document.getElementById("spinner").classList.remove("show");
        document.getElementById("btn-text").style.display = "flex";
        pw.style.display = "none";
      }
    };

    // ── LOAD RECENT (paginated) ──────────────────────────────
    window.loadRecent = async function() {
      if (!currentUser) return;
      try {
        const { data, error } = await supabase
          .from('students')
          .select('id, name, class, admission_no, photo_url, created_at')
          .eq('school_id', currentUser.id)
          .order('created_at', { ascending: false });
          
        if (error) throw error;
        allRecords = data || [];
        document.getElementById('total-count').textContent = allRecords.length;
        currentPage = 1;
        renderList(allRecords);
      } catch(e) {
        document.getElementById("recent-list").innerHTML =
          `<div class="empty-state"><p>Failed to load records.</p></div>`;
      }
    };

    // ── SEARCH ───────────────────────────────────────────────
    window.searchStudents = function() {
      const q = document.getElementById('search-query').value.trim().toLowerCase();
      if (!q) {
        currentPage = 1;
        renderList(allRecords);
        return;
      }
      const filtered = allRecords.filter(d => {
        const name = (d.name || '').toLowerCase();
        const adm  = (d.admission_no || '').toLowerCase();
        return name.includes(q) || adm.includes(q);
      });
      currentPage = 1;
      renderList(filtered);
    };

    // ── RENDER LIST (paginated) ──────────────────────────────
    function renderList(records) {
      const list = document.getElementById("recent-list");
      const pagination = document.getElementById("pagination");

      if (!records || records.length === 0) {
        list.innerHTML = '<div class="empty-state"><p>No students found.</p></div>';
        pagination.innerHTML = '';
        return;
      }

      const totalPages = Math.ceil(records.length / PAGE_SIZE);
      const start = (currentPage - 1) * PAGE_SIZE;
      const pageData = records.slice(start, start + PAGE_SIZE);

      list.innerHTML = pageData.map(d => {
        const sName = d.name || 'Unknown';
        const date  = d.created_at ? new Date(d.created_at).toLocaleDateString('en-IN') : '';
        const fallbackUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(sName)}&background=0ea5e9&color=fff`;
        const hasPhoto = !!d.photo_url;

        const safeName = escapeHtml(sName);
        const safeClass = d.class ? escapeHtml(d.class) : '';
        const safeAdm = d.admission_no ? escapeHtml(d.admission_no) : '';
        
        const photoMarkup = hasPhoto 
          ? `<img src="${d.photo_url}" class="td-photo" onerror="this.onerror=null; this.src='${fallbackUrl}'">`
          : `<div class="td-photo animate-pulse" style="display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.05); color:var(--text-muted); font-size:1.2rem; border-radius:6px; border:1px dashed var(--border);"><i class="fas fa-user-astronaut"></i></div>`;
          
        const photoBtn = hasPhoto
          ? `<button class="btn btn-outline btn-sm" onclick="window.triggerPhotoUpload('${d.id}')" style="font-size:0.75rem; padding:0.35rem 0.65rem; display:inline-flex; align-items:center; gap:4px;"><i class="fas fa-exchange-alt"></i> Replace Photo</button>`
          : `<button class="btn btn-primary btn-sm" onclick="window.triggerPhotoUpload('${d.id}')" style="font-size:0.75rem; padding:0.35rem 0.65rem; background:var(--primary); display:inline-flex; align-items:center; gap:4px;"><i class="fas fa-camera"></i> Upload Photo</button>`;

        return `<div class="record-item" id="student-row-${d.id}" style="display:flex; align-items:center; justify-content:space-between; gap:1rem;">
          <div style="display:flex; align-items:center; gap:1rem; flex:1; min-width:0;">
            ${photoMarkup}
            <div class="record-info">
              <strong>${safeName}</strong>
              <span>${safeClass ? 'Class ' + safeClass : ''} ${safeAdm ? '· Adm: ' + safeAdm : ''} ${date ? '· ' + date : ''}</span>
            </div>
          </div>
          <div style="display:flex; align-items:center; gap:0.5rem; flex-shrink:0;">
            ${photoBtn}
            <div id="inline-loader-${d.id}" style="display:none; color:var(--primary); margin:0 0.25rem;"><i class="fas fa-spinner fa-spin"></i></div>
            <button class="btn btn-danger btn-sm" title="Delete" onclick="window.deleteStudent('${d.id}')" style="padding:0.35rem 0.5rem;"><i class="fas fa-trash"></i></button>
          </div>
        </div>`;
      }).join('');

      // Pagination buttons
      if (totalPages <= 1) { pagination.innerHTML = ''; return; }
      let btns = '';
      for (let i = 1; i <= totalPages; i++) {
        btns += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
      }
      pagination.innerHTML = btns;
    }

    window.goPage = function(page) {
      currentPage = page;
      const q = document.getElementById('search-query').value.trim().toLowerCase();
      const filtered = q
        ? allRecords.filter(d => (d.name||'').toLowerCase().includes(q) || (d.admission_no||'').toLowerCase().includes(q))
        : allRecords;
      renderList(filtered);
    };

    // ── DELETE ───────────────────────────────────────────────
    // ── INLINE PHOTO UPLOAD HANDLERS ─────────────────────────
    window.triggerPhotoUpload = function(studentId) {
      const input = document.getElementById('student-photo-input');
      input.dataset.studentId = studentId;
      input.click();
    };

    window.handleStudentInlinePhotoUpload = async function(event) {
      const file = event.target.files[0];
      const studentId = event.target.dataset.studentId;
      if (!file || !studentId) return;

      if (file.size > 5 * 1024 * 1024) {
        alert("Photo must be less than 5MB");
        return;
      }

      const loader = document.getElementById(`inline-loader-${studentId}`);
      if (loader) loader.style.display = 'inline-block';

      try {
        const photoURL = await uploadToCloudinary(file);
        
        // Update student record in Supabase
        const { error } = await supabase
          .from('students')
          .update({ photo_url: photoURL })
          .eq('id', studentId);

        if (error) throw error;
        
        showStatus('success', 'Student photo updated successfully!');
        loadRecent();
      } catch (err) {
        alert("Upload failed: " + err.message);
      } finally {
        if (loader) loader.style.display = 'none';
        event.target.value = ''; // Reset input
      }
    };

    window.deleteStudent = async function(id) {
      if (!confirm("Delete this student record? This cannot be undone.")) return;
      try {
        const { data: student } = await supabase
          .from('students')
          .select('photo_url')
          .eq('id', id)
          .single();

        if (student?.photo_url && student.photo_url.includes('student-photos')) {
          const fileName = student.photo_url.split('/').pop();
          await supabase.storage
            .from('student-photos')
            .remove([fileName]);
        }

        const { error: e1 } = await supabase.from('student_field_values').delete().eq('student_id', id);
        if (e1) throw e1;

        const { error: e2 } = await supabase.from('students').delete().eq('id', id);
        if (e2) throw e2;

        showStatus('success', 'Student deleted.');
        loadRecent();
      } catch (err) {
        showStatus('error', 'Delete failed: ' + err.message);
      }
    };
  </script>
  <input
    type="file"
    id="student-photo-input"
    accept="image/*"
    style="display:none"
    onchange="handleStudentInlinePhotoUpload(event)"
  />
</body>
</html>
