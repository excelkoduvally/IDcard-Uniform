<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Students | Excel ID Cards</title>
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/images/favicon.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../assets/css/style-app.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <style>
    .school-filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .pill {
      padding: 0.4rem 1rem;
      border-radius: 100px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1.5px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      background: transparent;
    }

    .pill.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .pill:hover:not(.active) {
      border-color: var(--primary);
      color: var(--primary);
    }

    .table-section {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .table-section-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .search-input {
      position: relative;
    }

    .search-input i {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.85rem;
      pointer-events: none;
    }

    .search-input input {
      padding-left: 2.2rem;
      width: 220px;
    }

    /* Sticky table headers and sortable elements */
    .table-wrap {
      max-height: 600px;
      overflow-y: auto;
    }

    #students-table th {
      position: sticky;
      top: 0;
      background: #0f172a; /* Slate 900 matched to match template layout */
      z-index: 10;
      cursor: pointer;
      user-select: none;
    }

    #students-table th:hover {
      background: #1e293b;
    }

    #students-table th i {
      margin-left: 5px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>

<body>
  <div class="bg-mesh"></div>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <img src="../assets/images/excel_logo_transparent.png" alt="Excel Logo">
          <span>Excel <b>Admin</b></span>
        </div>
      </div>
      <ul class="sidebar-menu">
        <li><a href="admin.html"><i class="fas fa-chart-pie"></i> Dashboard</a></li>
        <li><a href="create-user.html"><i class="fas fa-user-plus"></i> Create User</a></li>
        <li><a href="schools.html"><i class="fas fa-school"></i> Schools</a></li>
        <li><a href="students.html" class="active"><i class="fas fa-users"></i> Students</a></li>
        <li><a href="admin-fields.html"><i class="fas fa-list-alt"></i> Student Fields</a></li>
        <li><a href="id-preview.html"><i class="fas fa-id-card"></i> ID Preview</a></li>
        <li><a href="../frontend/index.html" target="_blank"><i class="fas fa-globe"></i> View Website</a></li>
        <li class="mobile-only"><a href="#" onclick="handleLogout(event)"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </li>
      </ul>
      <div class="sidebar-footer">
        <button class="btn btn-outline btn-full" onclick="handleLogout(event)"><i class="fas fa-sign-out-alt"></i>
          Logout</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <div class="topbar-title">Student Database</div>
        <div class="user-badge"><i class="fas fa-shield-alt"></i> Admin Panel</div>
      </div>

      <div class="content-area">
        <h1 class="page-title">Uploaded <span>Students</span></h1>

        <div class="filter-bar">
          <div class="form-group">
            <label>Filter by School</label>
            <select id="school-filter" class="form-control" onchange="applyFilters()">
              <option value="">All Schools</option>
            </select>
          </div>
          <div class="form-group">
            <label>Filter by Class</label>
            <select id="class-filter" class="form-control" onchange="applyFilters()">
              <option value="">All Classes</option>
            </select>
          </div>
          <div class="form-group">
            <label>Search Name</label>
            <div class="search-input">
              <i class="fas fa-search"></i>
              <input type="text" id="search-input" class="form-control" placeholder="Type name..."
                oninput="applyFilters()" />
            </div>
          </div>
          <div class="actions">
            <button class="btn btn-success" id="btn-export-excel" onclick="downloadExcel()"><i
                class="fas fa-file-excel"></i> Export Excel</button>
            <button class="btn btn-info" id="btn-export-photos" onclick="downloadPhotos()"><i
                class="fas fa-file-archive"></i> Download Photos</button>
            <button class="btn btn-outline" onclick="loadStudents()"><i class="fas fa-sync-alt"></i> Refresh</button>
          </div>
        </div>

        <div class="school-filter-pills" id="school-pills"></div>

        <div class="table-section">
          <div class="table-section-header">
            <h3 id="table-title">All Students</h3>
            <span id="record-count" class="badge badge-blue">Loading...</span>
          </div>
          <div class="table-wrap">
            <table id="students-table">
              <thead>
                <tr>
                  <th>Photo</th>
                  <th>Name</th>
                  <th>Class</th>
                  <th>School</th>
                  <th>Date</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="table-body">
                <tr>
                  <td colspan="6">
                    <div class="empty-state"><i class="fas fa-spinner fa-spin"></i>
                      <p>Loading database...</p>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
        
        <div class="pagination-controls" style="display: flex; justify-content: center; gap: 1rem; margin-top: 1.5rem; align-items: center; padding-bottom: 2rem;">
          <button class="btn btn-outline" id="prev-page-btn" onclick="changePage(-1)" disabled>Previous</button>
          <span id="page-indicator" style="font-weight: 600; color: var(--text-muted);">Page 1</span>
          <button class="btn btn-outline" id="next-page-btn" onclick="changePage(1)">Next</button>
        </div>

      </div>
    </main>
  </div>

  <script type="module" src="../assets/js/auth.js"></script>
  <script type="module">
    import { guardPage, supabase } from "../assets/js/auth.js";

    guardPage('admin');

    let allStudents = [];
    let filteredStudents = [];
    let globalFields = [];
    
    // Pagination & Sorting State
    let currentPage = 0;
    const pageSize = 50;
    let totalCount = 0;
    let sortKey = 'created_at';
    let sortAsc = false;
    let searchTimeout = null;

    // HTML Escaping helper to prevent XSS
    function escapeHtml(str = "") {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Helper: compress/resize image to blob using canvas before embedding in Excel
    async function compressImageToBlob(url, maxDim = 150) {
      try {
        const response = await fetch(url);
        const blob = await response.blob();
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width;
            let h = img.height;
            if (w > h) {
              if (w > maxDim) {
                h = Math.round((h * maxDim) / w);
                w = maxDim;
              }
            } else {
              if (h > maxDim) {
                w = Math.round((w * maxDim) / h);
                h = maxDim;
              }
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            canvas.toBlob((b) => resolve(b), 'image/jpeg', 0.75);
          };
          img.onerror = () => reject(new Error("Image loading failed"));
          img.src = URL.createObjectURL(blob);
        });
      } catch (e) {
        throw e;
      }
    }

    // Load filter dropdowns once on start
    async function initFilters() {
      try {
        const [schoolsRes, fieldsRes, classesRes] = await Promise.all([
          supabase.from('schools').select('id, email, school_name'),
          supabase.from('student_fields').select('id, field_name, field_key'),
          // Fetch distinct classes from students
          supabase.from('students').select('class')
        ]);

        if (schoolsRes.data) {
          const selObj = document.getElementById("school-filter");
          selObj.innerHTML = '<option value="">All Schools</option>';
          
          const pillsEl = document.getElementById("school-pills");
          pillsEl.innerHTML = '';
          
          const btnAll = document.createElement("button");
          btnAll.className = "pill active";
          btnAll.textContent = "All";
          btnAll.onclick = () => {
            selObj.value = "";
            applyFilters();
          };
          pillsEl.appendChild(btnAll);

          schoolsRes.data.forEach(sch => {
            const name = sch.school_name || sch.email;
            selObj.appendChild(new Option(name, sch.id));
            
            const btn = document.createElement("button");
            btn.className = "pill";
            btn.textContent = (sch.school_name || sch.email.split('@')[0]).toUpperCase();
            btn.onclick = () => {
              selObj.value = sch.id;
              applyFilters();
            };
            pillsEl.appendChild(btn);
          });
        }

        if (fieldsRes.data) {
          globalFields = fieldsRes.data.map(f => ({
            name: f.field_name || f.field_key,
            key: f.field_key
          }));
        }

        if (classesRes.data) {
          const classesSet = new Set();
          classesRes.data.forEach(s => {
            if (s.class) classesSet.add(s.class);
          });
          const clsObj = document.getElementById("class-filter");
          clsObj.innerHTML = '<option value="">All Classes</option>';
          Array.from(classesSet).sort().forEach(c => {
            clsObj.appendChild(new Option(c, c));
          });
        }
      } catch (e) {
        console.warn("Failed to initialize dropdown filters", e);
      }
    }

    // Main: fetch paginated students
    window.loadStudents = async function () {
      const tbody = document.getElementById("table-body");
      tbody.innerHTML = `<tr><td colspan="100%"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Loading records...</p></div></td></tr>`;

      try {
        const schId = document.getElementById("school-filter").value;
        const cls = document.getElementById("class-filter").value;
        const search = document.getElementById("search-input").value.trim();

        let query = supabase
          .from('students')
          .select(`
            id,
            name,
            class,
            created_at,
            photo_url,
            school_id,
            student_data,
            parent_phone,
            dob,
            schools (
              id,
              email,
              school_name
            ),
            student_field_values (
              value,
              student_fields (
                field_name,
                field_key
              )
            )
          `, { count: 'exact' });

        if (schId) {
          query = query.eq('school_id', schId);
        }
        if (cls) {
          query = query.eq('class', cls);
        }
        if (search) {
          query = query.ilike('name', `%${search}%`);
        }

        // Apply sorting
        query = query.order(sortKey === 'created_at' ? 'created_at' : 'name', { ascending: sortAsc });

        // Apply server pagination range
        const start = currentPage * pageSize;
        const end = start + pageSize - 1;
        query = query.range(start, end);

        const { data, count, error } = await query;
        if (error) throw error;

        allStudents = data || [];
        totalCount = count || 0;
        filteredStudents = [...allStudents]; // Already server filtered

        // Parse student JSON values & relations cleanly
        allStudents.forEach(s => {
          s.school_email = s.schools?.email || 'Unknown';
          s.school_name = s.schools?.school_name || 'Unknown';

          if (typeof s.student_data === 'string') {
            try { s.student_data = JSON.parse(s.student_data); } catch (e) { s.student_data = {}; }
          }
          if (!s.student_data) s.student_data = {};

          if (s.student_field_values) {
            s.student_field_values.forEach(fv => {
              if (fv.student_fields) {
                s.student_data[fv.student_fields.field_key] = fv.value;
                if (fv.student_fields.field_key === 'class' && !s.class) {
                  s.class = fv.value;
                }
              }
            });
          }
        });

        // Update record count & pagination indicators
        document.getElementById("record-count").textContent = `${totalCount} Records`;
        document.getElementById("page-indicator").textContent = `Page ${currentPage + 1} of ${Math.max(1, Math.ceil(totalCount / pageSize))}`;
        
        // Toggle pagination buttons
        document.getElementById("prev-page-btn").disabled = currentPage === 0;
        document.getElementById("next-page-btn").disabled = (currentPage + 1) * pageSize >= totalCount;

        renderTable();
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="100%"><div class="empty-state">Error: ${err.message}</div></td></tr>`;
      }
    };

    // Debounced filter application
    window.applyFilters = function () {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        currentPage = 0; // Reset pagination on filter change
        
        // Highlight active pills visually
        const schId = document.getElementById("school-filter").value;
        document.querySelectorAll(".pill").forEach(p => {
          const pillText = p.textContent.toLowerCase();
          if (!schId && pillText === "all") {
            p.classList.add("active");
          } else {
            p.classList.remove("active");
          }
        });

        loadStudents();
      }, 300);
    };

    // Pagination trigger
    window.changePage = function (direction) {
      currentPage += direction;
      loadStudents();
    };

    // Sort trigger
    window.sortColumn = function (key) {
      if (sortKey === key) {
        sortAsc = !sortAsc;
      } else {
        sortKey = key;
        sortAsc = true;
      }
      loadStudents();
    };

    // Render client UI table dynamically
    function renderTable() {
      const thead = document.querySelector("#students-table thead");
      const tbody = document.getElementById("table-body");

      if (filteredStudents.length === 0) {
        tbody.innerHTML = `<tr><td colspan="100%"><div class="empty-state"><p>No records found.</p></div></td></tr>`;
        return;
      }

      // Filter custom headers (excluding core fields to prevent duplication)
      const customHeaders = globalFields.filter(f => {
        const fl = f.name.toLowerCase();
        return fl !== 'name' && fl !== 'class';
      });

      // Build Headers with Clickable Sort Triggers
      let theadHTML = `<tr>
        <th>Photo</th>
        <th onclick="sortColumn('name')">Name <i class="fas ${sortKey === 'name' ? (sortAsc ? 'fa-sort-up' : 'fa-sort-down') : 'fa-sort'}"></i></th>
        <th>Class</th>
        <th>School</th>
        <th onclick="sortColumn('created_at')">Date <i class="fas ${sortKey === 'created_at' ? (sortAsc ? 'fa-sort-up' : 'fa-sort-down') : 'fa-sort'}"></i></th>`;
      
      customHeaders.forEach(h => {
        theadHTML += `<th>${escapeHtml(h.name)}</th>`;
      });
      theadHTML += `<th>Action</th></tr>`;
      thead.innerHTML = theadHTML;

      tbody.innerHTML = filteredStudents.map(s => {
        const name = s.name || s.student_data?.Name || "No Name";
        const cls = s.class || s.student_data?.Class || "N/A";
        const dateStr = s.created_at ? new Date(s.created_at).toLocaleDateString() : 'N/A';
        const fallbackUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=0ea5e9&color=fff`;

        const photoImg = s.photo_url 
          ? `<img src="${escapeHtml(s.photo_url)}" class="td-photo" loading="lazy" onerror="this.onerror=null; this.src='${fallbackUrl}'">` 
          : `<div class="td-photo-placeholder"><i class="fas fa-user"></i></div>`;

        let rowHTML = `<tr>
          <td>${photoImg}</td>
          <td><strong>${escapeHtml(name)}</strong></td>
          <td><span class="badge badge-blue">${escapeHtml(cls)}</span></td>
          <td style="color:var(--text-muted)">${escapeHtml((s.school_name || s.school_email.split("@")[0]).toUpperCase())}</td>
          <td>${escapeHtml(dateStr)}</td>`;

        customHeaders.forEach(h => {
          const val = s.student_data && s.student_data[h.key] ? s.student_data[h.key] : '-';
          rowHTML += `<td style="color:var(--text-muted); font-size:0.85rem">${escapeHtml(val)}</td>`;
        });

        rowHTML += `<td>
            <button class="btn btn-danger btn-sm" onclick="deleteStudent('${s.id}')"><i class="fas fa-trash"></i></button>
          </td>
        </tr>`;

        return rowHTML;
      }).join('');
    }

    window.deleteStudent = async function (id) {
      if (!confirm("Are you sure you want to delete this specific student record?")) return;
      try {
        const { error } = await supabase.from('students').delete().eq('id', id);
        if (error) throw error;
        loadStudents();
      } catch (err) {
        alert("Failed to delete: " + err.message);
      }
    };

    // Batch downloading photos with parallel batches of 10
    window.downloadPhotos = async function () {
      if (filteredStudents.length === 0) {
        alert("No student photos available to download.");
        return;
      }

      const btn = document.getElementById("btn-export-photos");
      const btnText = btn.innerHTML;
      btn.disabled = true;

      try {
        const zip = new window.JSZip();
        const batchSize = 10;
        const total = filteredStudents.length;

        for (let i = 0; i < total; i += batchSize) {
          const batch = filteredStudents.slice(i, i + batchSize);
          btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Downloading ${i + 1}/${total}...`;

          await Promise.all(batch.map(async (student) => {
            if (!student.photo_url) return;
            const name = student.name || student.student_data?.Name || "Student";
            const filename = name.replace(/\s+/g, "_") + ".jpg";
            try {
              const response = await fetch(student.photo_url);
              if (!response.ok) throw new Error("Fetch failed");
              const blob = await response.blob();
              zip.file(filename, blob);
            } catch (err) {
              console.warn("Failed downloading photo for", name, err);
            }
          }));
        }

        btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Bundling ZIP...`;
        const content = await zip.generateAsync({ type: "blob" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(content);

        const sch = document.getElementById("school-filter").value;
        const typeStr = sch ? "School" : "All";
        link.download = `Photos_${typeStr}.zip`;
        link.click();
      } catch (err) {
        alert("Error creating ZIP: " + err.message);
      } finally {
        btn.innerHTML = btnText;
        btn.disabled = false;
      }
    };

    // Parallel compressed Excel exports preventing memory blowouts
    window.downloadExcel = async function () {
      if (filteredStudents.length === 0) {
        alert("No student records available to export.");
        return;
      }

      const btn = document.getElementById("btn-export-excel");
      const btnText = btn.innerHTML;
      btn.disabled = true;

      try {
        const workbook = new ExcelJS.Workbook();
        const worksheet = workbook.addWorksheet("Students");

        const customFields = globalFields.filter(f => {
          const fl = f.name.toLowerCase();
          return fl !== 'name' && fl !== 'class';
        });
        const headers = ["Photo", "Name", "Class", "School", "Date_Added", ...customFields.map(f => f.name)];

        worksheet.columns = headers.map(h => ({
          header: h,
          key: h,
          width: h === 'Photo' ? 12 : 20
        }));

        const total = filteredStudents.length;
        const batchSize = 10;

        for (let i = 0; i < total; i += batchSize) {
          const batch = filteredStudents.slice(i, i + batchSize);
          btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Processing ${i + 1}/${total}...`;

          const rowPromises = batch.map(async (s, index) => {
            const rowIndex = i + index + 1;
            const name = s.name || s.student_data?.Name || "No Name";
            const cls = s.class || s.student_data?.Class || "N/A";
            const dateStr = s.created_at ? new Date(s.created_at).toLocaleDateString() : 'N/A';

            const rowData = {
              Name: name,
              Class: cls,
              School: s.school_name || "Unknown",
              Date_Added: dateStr
            };

            customFields.forEach(f => {
              rowData[f.name] = s.student_data && s.student_data[f.key] ? s.student_data[f.key] : '-';
            });

            return { s, rowData, rowIndex };
          });

          const resolvedRows = await Promise.all(rowPromises);

          for (const item of resolvedRows) {
            const row = worksheet.addRow(item.rowData);
            row.height = 65;

            if (item.s.photo_url) {
              try {
                // Compress & resize image to 150px before embedding to avoid memory crash
                const compressedBlob = await compressImageToBlob(item.s.photo_url, 150);
                
                const base64 = await new Promise((resolve) => {
                  const reader = new FileReader();
                  reader.onloadend = () => resolve(reader.result);
                  reader.readAsDataURL(compressedBlob);
                });

                const imageId = workbook.addImage({
                  base64: base64,
                  extension: 'jpeg',
                });

                worksheet.addImage(imageId, {
                  tl: { col: 0.1, row: row.number - 0.9 },
                  ext: { width: 60, height: 60 },
                  editAs: 'oneCell'
                });
              } catch (e) {
                console.warn("Failed embedding photo in Excel for", item.s.name, e);
              }
            }
          }
        }

        btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Saving file...`;
        const buffer = await workbook.xlsx.writeBuffer();
        const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });

        const schId = document.getElementById("school-filter").value;
        const typeStr = schId ? "Filtered" : "All_Schools";

        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `Students_Export_${typeStr}.xlsx`;
        a.click();
        window.URL.revokeObjectURL(url);
      } catch (err) {
        alert("Excel export failed: " + err.message);
      } finally {
        btn.innerHTML = btnText;
        btn.disabled = false;
      }
    };

    // Load dropdown values and paginate records initial trigger
    async function start() {
      await initFilters();
      await loadStudents();
    }

    start();
  </script>
</body>

</html>
