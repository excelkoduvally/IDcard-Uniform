<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Login | Excel ID Cards</title>
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/images/favicon.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../assets/css/style-app.css" />
  <style>
    .login-wrapper { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; position:relative; z-index:1; }
    .login-box { width:100%; max-width:440px; }
    .login-header { text-align:center; margin-bottom:2.5rem; }
    .login-header .logo { height:56px; margin-bottom:1rem; }
    .login-title { font-size:1.6rem; font-weight:800; }
    .login-title span { color:var(--primary); }
    .login-subtitle { color:var(--text-muted); font-size:0.9rem; margin-top:0.4rem; }
    .divider { display:flex; align-items:center; gap:0.75rem; margin:1.5rem 0; }
    .divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--border); }
    .divider span { color:var(--text-muted); font-size:0.78rem; }
    .login-footer { text-align:center; margin-top:1.5rem; color:var(--text-muted); font-size:0.82rem; }
    .login-footer a { color:var(--primary); text-decoration:none; font-weight:600; }
    .powered { display:flex; align-items:center; gap:8px; justify-content:center; color:var(--text-muted); font-size:0.8rem; margin-top:0.5rem; }
    .powered img { height:18px; }
  </style>
</head>
<body>
  <div class="bg-mesh"></div>
  <div class="login-wrapper">
    <div class="login-box">
      <div class="login-header">
        <img src="../assets/images/excel_logo_transparent.png" alt="Excel ID Cards" class="logo">
        <h1 class="login-title">School <span>Portal</span> Login</h1>
        <p class="login-subtitle">Sign in to upload student data for ID card production</p>
      </div>
      <div class="card">
        <div id="alert-box" class="alert"></div>
        <div class="form-group">
          <label><i class="fas fa-envelope"></i> &nbsp;Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="school@example.com" autocomplete="email" />
        </div>
        <div class="form-group">
          <label><i class="fas fa-lock"></i> &nbsp;Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter your password" autocomplete="current-password" />
        </div>
        <button id="login-btn" class="btn btn-primary btn-full" onclick="handleLogin()">
          <span id="btn-text"><i class="fas fa-sign-in-alt"></i> Sign In</span>
          <div class="spinner" id="spinner"></div>
        </button>
        <div class="divider"><span>Secure Login</span></div>
        <div class="powered">
          <i class="fas fa-shield-alt" style="color:var(--success)"></i>
          Protected by Supabase Authentication
        </div>
      </div>
      <div class="login-footer">
        Trouble logging in? &nbsp;<a href="mailto:excelkdly@gmail.com">Contact Support</a>
      </div>
    </div>
  </div>
  <script type="module" src="../assets/js/auth.js"></script>
</body>
</html>
